 <text x="180" y="171" class="white" font-size="17" font-weight="700">let me go</text>
 <text x="180" y="191" class="muted" font-size="14">otuka</text>
 <text x="180" y="218" class="muted" font-size="13">on</text><text x="232" y="218" class="white" font-size="13" font-weight="600">YouTube Music</text>
