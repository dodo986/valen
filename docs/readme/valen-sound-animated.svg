<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">Valen — Sound notebook and equalizer</title>
<desc id="desc">Animated dark pink audio settings interface, with an open notebook and a ten-band equalizer.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d1d1d"/><stop offset=".55" stop-color="#161616"/><stop offset="1" stop-color="#131313"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#111"/><stop offset=".5" stop-color="#232323"/><stop offset="1" stop-color="#080808"/></linearGradient>
 <linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff9ebf" stop-opacity=".22"/><stop offset="1" stop-color="#ff9ebf" stop-opacity="0"/></linearGradient>
 <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ac2dd"/><stop offset=".45" stop-color="#477aa0"/><stop offset="1" stop-color="#10243e"/></linearGradient>
 <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#fff" opacity=".09"/></pattern>
 <clipPath id="pageClip"><rect x="20" y="97" width="777" height="420" rx="13"/></clipPath>
 <clipPath id="eqClip"><rect x="827" y="137" width="771" height="379" rx="14"/></clipPath>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style><![CDATA[
 text{font-family:Arial,Helvetica,sans-serif;paint-order:stroke;}
 .white{fill:#f6f3f5}.muted{fill:#a5a0a4}.soft{fill:#767074}.pink{fill:#ffa2c2}
 .paperLines line{stroke:#c1bcc0;stroke-opacity:.105;stroke-width:1}
 .appearing{animation:appear .85s cubic-bezier(.2,.8,.2,1) both}
 .notebook{animation:appear .9s .12s cubic-bezier(.2,.8,.2,1) both}
 .eqpanel{animation:appear .9s .26s cubic-bezier(.2,.8,.2,1) both}
 .eqTrace{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 2.5s .6s cubic-bezier(.3,.2,.3,1) forwards,glow 4s 3s ease-in-out infinite}
 .eqFill{opacity:0;animation:fadeIn 1.3s 1.6s forwards}
 .point{transform-box:fill-box;transform-origin:center;animation:pointIn .5s both,pointBreath 3.4s ease-in-out infinite;}
 .p1{animation-delay:1.2s,1.8s}.p2{animation-delay:1.3s,2s}.p3{animation-delay:1.4s,2.2s}.p4{animation-delay:1.5s,2.4s}.p5{animation-delay:1.6s,2.6s}.p6{animation-delay:1.7s,2.8s}.p7{animation-delay:1.8s,3s}.p8{animation-delay:1.9s,3.2s}.p9{animation-delay:2s,3.4s}.p10{animation-delay:2.1s,3.6s}
 .underline{stroke-dasharray:143;stroke-dashoffset:143;animation:drawUnderline 1.1s .35s ease-out forwards}
 .playing{animation:playing 2.2s ease-in-out infinite}
 .play2{animation-delay:.7s}.play3{animation-delay:1.4s}
 .rowPop{animation:rowPop .8s both}.r1{animation-delay:.6s}.r2{animation-delay:.8s}.r3{animation-delay:1s}
 .led{animation:led 2.8s ease-in-out infinite}
 .knob{animation:knob 4s ease-in-out infinite}
 .hand{animation:hand 4s ease-in-out infinite}
 @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
 @keyframes draw{0%{stroke-dashoffset:1100}100%{stroke-dashoffset:0}}
 @keyframes drawUnderline{to{stroke-dashoffset:0}}
 @keyframes fadeIn{to{opacity:1}}
 @keyframes pointIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
 @keyframes pointBreath{0%,100%{opacity:1}50%{opacity:.65}}
 @keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #ff91b7)}50%{filter:drop-shadow(0 0 6px #ff91b7)}}
 @keyframes playing{0%,100%{opacity:.35;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1.2)}}
 @keyframes rowPop{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:translateX(0)}}
 @keyframes led{0%,100%{opacity:1}50%{opacity:.5}}
 @keyframes knob{0%,100%{transform:translateX(0)}50%{transform:translateX(-2px)}}
 @keyframes hand{0%,100%{opacity:.85}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.eqTrace{stroke-dashoffset:0}.eqFill{opacity:1}.underline{stroke-dashoffset:0}}
]]></style>
