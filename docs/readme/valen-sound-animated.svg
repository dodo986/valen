 <g class="rowPop r2"><circle cx="52" cy="394" r="3.5" fill="#f69bbb"/><text x="77" y="400" class="white" font-size="16" font-weight="700">EQ</text><text x="77" y="425" class="muted" font-size="13">+9 dB at 62 Hz, −2 dB at 1 kHz</text><text x="749" y="400" class="soft" font-size="12">22:21</text></g>
 <g class="rowPop r3"><circle cx="52" cy="449" r="3.5" fill="#f69bbb"/><text x="77" y="456" class="white" font-size="16" font-weight="700">Preamp +1.5 dB</text><text x="77" y="484" class="muted" font-size="13">louder in</text><text x="749" y="456" class="soft" font-size="12">22:21</text></g>
 </g>
