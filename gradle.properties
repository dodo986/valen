org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Valen's version: the one place it is written. A release build is given the tag's version instead
# (-Pvalen.version=1.0.0-alpha.3, see .github/workflows/release.yml). MAJOR.MINOR.PATCH, optionally
# -alpha.N, -beta.N or -rc.N; the build refuses anything else, because the updater compares the
# number made from it (core/Updates.kt, ValenVersion.code).
valen.version=1.0.0-alpha.21

# Spotify on Android: the build makes the Web Player, its sign-in and the adapter, as the desktop
# does (Revera's sign-in relay; see HANDOFF.md). false leaves Spotify out of an Android build
# entirely, so a saved Spotify song plays from another service's copy of the same recording.
valen.android.spotify=true
